<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Twins Mobilya – Giriş</title>
<style>
:root{--bg:#000;--card:#121214;--line:#2a2a2e;--tx:#fff;--mut:#9a9aa2;--acc:#e5231b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:420px;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px}
.logo{width:100%;max-width:300px;margin:0 auto 36px;display:block}
h1{font-size:22px;margin:0 0 4px;text-align:center;font-weight:700}
.sub{color:var(--mut);font-size:14px;text-align:center;margin:0 0 28px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 8px}
.field{position:relative}
.field svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input[type=text]{width:100%;height:56px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--tx);font-size:17px;padding:0 16px 0 48px;outline:none;transition:border-color .15s}
input[type=text]:focus{border-color:var(--acc)}
.err input[type=text]{border-color:var(--acc)}
.msg{color:#ff6b64;font-size:13px;min-height:18px;margin:8px 2px 0}
.rem{display:flex;align-items:center;gap:10px;margin:14px 2px 22px;font-size:14px;color:var(--mut)}
.rem input{width:20px;height:20px;accent-color:var(--acc);margin:0}
button{width:100%;height:56px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
button:active{transform:scale(.98);filter:brightness(.9)}
.foot{text-align:center;color:#55555c;font-size:12px;margin-top:32px}
.ok{text-align:center}
.ok h1{margin-top:24px}
.hide{display:none}
.wrap.home{justify-content:flex-start}
.wrap.home .logo{max-width:190px;margin:8px auto 20px}
.wrap.home .foot{margin-top:auto;padding-top:24px}
.top{display:flex;align-items:center;justify-content:space-between;margin:0 0 18px}
.top h1{text-align:left;margin:0;font-size:20px}
.top small{color:var(--mut);font-size:13px;display:block;margin-bottom:2px}
.top button{width:auto;height:40px;padding:0 16px;font-size:14px;background:var(--card);border:1.5px solid var(--line);font-weight:600}
.menu{display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:14px;width:100%;height:auto;min-height:72px;padding:12px 16px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;color:var(--tx);font-weight:400}
.item:active{border-color:var(--acc)}
.ic{flex:none;width:44px;height:44px;border-radius:12px;background:#1d1d21;display:flex;align-items:center;justify-content:center}
.ic svg{width:24px;height:24px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.item b{display:block;font-size:16px;font-weight:600}
.item span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.item .ch{margin-left:auto;width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pg{text-align:center;padding-top:40px}
.mb{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.mb .lb{flex:1;text-align:center;font-weight:700;font-size:16px}
.mb .lb small{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:2px}
.mb button{width:44px;height:44px;padding:0;font-size:24px;background:var(--card);border:1.5px solid var(--line);flex:none}
@media print{#mt .rp,#mt .rp *{visibility:visible}#mt .rp{position:absolute;left:0;top:0;width:100%;background:#fff;color:#000}}
.tw{overflow-x:auto}
.gt{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
.gt th,.gt td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.gt th{background:#1d1d21;text-align:center}
.rp h2{font-size:16px;text-align:center;margin:16px 0 10px}
@page{size:landscape}
@media print{body *{visibility:hidden}#gr .rp,#gr .rp *{visibility:visible}#gr .rp{position:absolute;left:0;top:0;width:100%;background:#fff;color:#000}.gt th{background:#ddd;color:#000}.gt th,.gt td{border-color:#000}.tw{overflow:visible}}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.chips button{width:auto;flex:none;height:36px;padding:0 14px;font-size:13px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;font-weight:600;color:var(--mut)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tk{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tk:active{border-color:var(--acc)}
.tk .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.tk .h .bd{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;border:1.5px solid}
.tk .g{font-size:13.5px;color:#ddd;margin:6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk .pb{height:6px;background:#222;border-radius:3px;overflow:hidden}
.tk .pb i{display:block;height:100%;background:var(--acc)}
.tk .m{font-size:12px;color:var(--mut);margin-top:6px}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 110px}
.ov .in{max-width:420px;margin:0 auto}
.dg{background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:60}
.sheet{width:100%;max-width:420px;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:85%;overflow:auto}
.sheet label,.fld label{display:block;margin:10px 0 6px}
.sheet select,.sheet input,.fm input,.fm select,.fm textarea{width:100%;height:48px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;color:#fff;font-size:16px;padding:0 12px;outline:none;font-family:inherit}
.fm input[type=text],.sheet input[type=text]{padding:0 12px;height:48px}
.fm textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.fm select:focus,.fm input:focus,.fm textarea:focus{border-color:var(--acc)}
.sc{margin:22px 0 4px;font-size:12px;letter-spacing:.6px;color:var(--acc);font-weight:700}
.chip{width:auto!important;height:40px!important;margin:6px 8px 0 0;padding:0 14px;font-size:14px!important;background:var(--card)!important;border:1.5px solid var(--line);color:var(--mut)!important;font-weight:600!important;border-radius:20px!important}
.chip.on{border-color:var(--acc);color:#fff!important}
.bar2{display:flex;gap:8px;margin-top:16px}
.bar2 button{flex:1;width:auto;height:48px;font-size:15px}
.sec{background:var(--bg)!important;border:1.5px solid var(--line)!important}
.fbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:#000e;border-top:1px solid var(--line);z-index:55}
.fbar .bar2{max-width:420px;margin:0 auto}
.acc{background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.ah{display:flex;align-items:center;gap:10px;width:100%;height:60px;padding:0 16px;background:none;border:0;border-radius:0;color:#fff;font-size:17px;font-weight:600;text-align:left}
.ah .cn{margin-left:auto;background:#1d1d21;border-radius:10px;padding:2px 10px;font-size:13px;color:var(--mut);font-weight:600}
.ah svg{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex:none}
.acc.open .ah svg{transform:rotate(90deg)}
.ab{padding:0 16px 16px}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.sb{font-size:13px;color:var(--mut);text-align:right;max-width:45%}
.add input[type=text]{flex:1 1 130px;min-width:0;height:48px;padding:0 14px;font-size:16px}
.add button{width:auto;height:48px;padding:0 18px;font-size:15px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li .n{flex:1;font-size:16px;word-break:break-word}
.li .cd{font-size:13px;font-weight:700;color:var(--acc);background:#1d1d21;border-radius:8px;padding:4px 8px}
.li .x{width:36px;height:36px;padding:0;background:none;border:0;color:var(--mut);font-size:22px;font-weight:400}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.pg button{margin-top:24px;background:var(--card);border:1.5px solid var(--line)}
</style></head><body>

<script>
var SS="twins_sess";
function setSess(u,keep){try{localStorage.removeItem(SS);sessionStorage.removeItem(SS);(keep?localStorage:sessionStorage).setItem(SS,JSON.stringify({u:u,p:""}))}catch(e){}}
function getSess(){try{var v=localStorage.getItem(SS)||sessionStorage.getItem(SS);return v?JSON.parse(v):null}catch(e){return null}}
function setPage(p){try{var st=localStorage.getItem(SS)?localStorage:sessionStorage,v=st.getItem(SS);if(!v)return;var o=JSON.parse(v);o.p=p;st.setItem(SS,JSON.stringify(o))}catch(e){}}
function clrSess(){try{localStorage.removeItem(SS);sessionStorage.removeItem(SS)}catch(e){}}
var K="twins_user";
var u=document.getElementById("u"),m=document.getElementById("m"),box=document.getElementById("box");
function get(){try{return localStorage.getItem(K)||""}catch(e){return ""}}
function set(v){try{v?localStorage.setItem(K,v):localStorage.removeItem(K)}catch(e){}}
function show(name){
 document.getElementById("login").classList.add("hide");
 document.getElementById("done").classList.remove("hide");
 document.getElementById("hi").textContent=name;document.querySelector(".wrap").classList.add("home");
}
function login(){
 var v=u.value.trim();
 if(v.length<2){box.classList.add("err");m.textContent="Lütfen kullanıcı adınızı girin.";u.focus();return}
 box.classList.remove("err");m.textContent="";
 set(document.getElementById("r").checked?v:"");
 setSess(v,document.getElementById("r").checked);
 show(v);
}
document.getElementById("go").onclick=login;
u.addEventListener("keydown",function(e){if(e.key==="Enter")login()});
u.addEventListener("input",function(){box.classList.remove("err");m.textContent=""});
document.getElementById("out").onclick=function(){clrSess();document.querySelector(".wrap").classList.remove("home");
 document.getElementById("done").classList.add("hide");
 document.getElementById("login").classList.remove("hide");
 u.value=get();
};

function unfin(x){return !x.arsiv&&["tamamlandı","iptal edildi"].indexOf(lc(x.durum||""))<0&&x.oran!=="100"}
function inMonth(x,ym){
 if(ym==="all")return true;
 var bm=x.bt?x.bt.slice(0,7):"";
 if(ym==="none")return !bm;
 if(!bm)return ym===curYm;
 return bm===ym||(unfin(x)&&bm<ym&&ym<=curYm);
}
function mbRender(){
 var b=document.getElementById("mb");b.innerHTML="";
 var row=mk("div","mb"),pv=mk("button","","‹"),nx=mk("button","","›"),lb=mk("div","lb");
 pv.type=nx.type="button";
 var named=mo!=="all"&&mo!=="none";
 lb.appendChild(document.createTextNode(mo==="all"?"Tüm aylar":(mo==="none"?"Tarihsiz":ymName(mo))));
 var sm=mk("small","","");sm.id="mcnt";lb.appendChild(sm);
 pv.onclick=function(){mo=named?ymAdd(mo,-1):curYm;renderList()};
 nx.onclick=function(){mo=named?ymAdd(mo,1):curYm;renderList()};
 row.appendChild(pv);row.appendChild(lb);row.appendChild(nx);b.appendChild(row);
 var ch=mk("div","chips");
 [["Bu ay",curYm],["Tüm aylar","all"],["Tarihsiz","none"]].forEach(function(f){var c=mk("button",mo===f[1]?"on":"",f[0]);c.type="button";c.onclick=function(){mo=f[1];renderList()};ch.appendChild(c)});
 b.appendChild(ch);
}

function todayIso(){var d=new Date();return d.getFullYear()+"-"+pd(d.getMonth()+1)+"-"+pd(d.getDate())}
function gsRow(x){return [x.musteri,x.gorev,x.renk,x.tanim,x.adet,x.ilerleme].map(function(v){return v==null?"":v})}
function gsMake(){
 var dt=document.getElementById("gd").value,gm=document.getElementById("gm"),gr=document.getElementById("gr");
 gr.innerHTML="";gm.textContent="";
 if(!dt){gm.textContent="Lütfen rapor tarihini seçin.";return}
 var rows=[],warn=[];
 T.list.slice().sort(function(a,b){return a.no-b.no}).forEach(function(x){if(x.bt===dt)rows.push(gsRow(x))});
 document.getElementById("ge").value.split(",").forEach(function(s){
  s=s.trim();if(!s)return;
  var x=T.list.filter(function(i){return String(i.no)===s})[0];
  if(x)rows.push(gsRow(x));else warn.push(s+" numaralı kayıt bulunamadı.");
 });
 var box=mk("div","rp");box.appendChild(mk("h2","","GÜN SONU RAPORU - "+fd(dt)));
 var tb=mk("table","gt"),hd=mk("tr");
 ["PROJE","GÖREV","RENK","TANIM","ADET","İLERLEME"].forEach(function(h){hd.appendChild(mk("th","",h))});
 tb.appendChild(hd);
 rows.forEach(function(r){var tr=mk("tr");r.forEach(function(v){tr.appendChild(mk("td","",v))});tb.appendChild(tr)});
 var wr=mk("div","tw");wr.appendChild(tb);box.appendChild(wr);gr.appendChild(box);
 gm.textContent=rows.length+" adet iş rapora eklendi."+(warn.length?" "+warn.join(" "):"");
 var pb=mk("button","sec","PDF Oluştur");pb.type="button";pb.style.marginTop="12px";
 pb.onclick=function(){savePdf("gun-sonu-"+dt+".pdf","GÜN SONU RAPORU - "+fd(dt),["PROJE","GÖREV","RENK","TANIM","ADET","İLERLEME"],rows,[2,4,1.5,2,1,3],gm)};
 gr.appendChild(pb);
}
document.getElementById("gbk").onclick=homeBack;
document.getElementById("gmk").onclick=gsMake;
var MK="twins_mlz",M={list:[],n:1},mc=null,mNew=false,mrep=false;
try{var s3=localStorage.getItem(MK);if(s3){var o3=JSON.parse(s3);if(o3&&o3.list)M=o3}}catch(e){}
function saveM(){try{localStorage.setItem(MK,JSON.stringify(M))}catch(e){}}
var MF=[["proje","Proje","t","dl-p"],["tanim","Tanım","t"],["malzeme","Malzeme","t","dl-m"],["en","En","n"],["boy","Boy","n"],["kalinlik","Kalınlık","n"],["renk","Renk","t"],["adet","Adet","n"]];
function mClose(){var ov=document.getElementById("mfm");ov.classList.add("hide");ov.innerHTML=""}
function mlRender(){
 [["dl-p","musteri"],["dl-m","malzeme"]].forEach(function(p){var d=document.getElementById(p[0]);d.innerHTML="";src(p[1]).forEach(function(v){var o=mk("option");o.value=v;d.appendChild(o)})});
 document.getElementById("md").textContent="Tarih: "+fd(todayIso())+" · Yapılacak iş listesindeki plaka bilgileri otomatik eklenir.";
 var mt=document.getElementById("mt");mt.innerHTML="";
 var L=mAuto().concat(M.list.slice().sort(function(a,b){return a.no-b.no}));
 if(mrep){
  var box=mk("div","rp");box.appendChild(mk("h2","","AY SONU DEĞERLENDİRME - "+fd(todayIso())));
  var tb=mk("table","gt"),hd=mk("tr");
  ["NO","PROJE","TANIM","MALZEME","EN","BOY","KALINLIK","RENK","ADET"].forEach(function(h){hd.appendChild(mk("th","",h))});
  tb.appendChild(hd);
  L.forEach(function(x,n){var tr=mk("tr");[n+1,x.proje,x.tanim,x.malzeme,x.en,x.boy,x.kalinlik,x.renk,x.adet].forEach(function(v){tr.appendChild(mk("td","",v==null?"":v))});tb.appendChild(tr)});
  var wr=mk("div","tw");wr.appendChild(tb);box.appendChild(wr);mt.appendChild(box);
  var pb=mk("button","sec","PDF Oluştur");pb.type="button";pb.style.marginTop="12px";
  pb.onclick=function(){savePdf("ay-sonu-degerlendirme-"+todayIso()+".pdf","AY SONU DEĞERLENDİRME - "+fd(todayIso()),["NO","PROJE","TANIM","MALZEME","EN","BOY","KALINLIK","RENK","ADET"],L.map(function(x,n){return [n+1,x.proje,x.tanim,x.malzeme,x.en,x.boy,x.kalinlik,x.renk,x.adet]}),[0.6,2,2,2,1,1,1,1.5,1],document.getElementById("md"))};mt.appendChild(pb);
  var bk=mk("button","sec","Listeye Dön");bk.type="button";bk.style.marginTop="8px";
  bk.onclick=function(){mrep=false;mlRender()};mt.appendChild(bk);
  return;
 }
 if(!L.length){mt.appendChild(mk("div","empty","Henüz kayıt yok."));return}
 L.forEach(function(x,n){
  var c=mk("div","tk"),hh=mk("div","h");hh.appendChild(mk("span","","#"+(n+1)+" "+(x.proje||"—")));
  if(x.auto){var ab=mk("span","bd","iş listesi #"+x.tno);ab.style.color=ab.style.borderColor="#9a9aa2";hh.appendChild(ab)}
  c.appendChild(hh);
  var a=[x.tanim,x.malzeme].filter(Boolean).join(" · ");if(a)c.appendChild(mk("div","g",a));
  var m=[[x.en,x.boy,x.kalinlik].filter(Boolean).join(" x "),x.renk,x.adet?x.adet+" adet":""].filter(Boolean).join(" · ");
  if(m)c.appendChild(mk("div","m",m));
  c.onclick=function(){x.auto?mAutoOpen(x):mOpen(x)};mt.appendChild(c);
 });
}
var MK2=["tanim","malzeme","en","boy","kalinlik","renk","adet"];
function mAuto(){
 return T.list.filter(function(t){return MK2.some(function(k){return t[k]!==undefined&&t[k]!==""})})
  .sort(function(a,b){return a.no-b.no})
  .map(function(t){return {auto:true,tno:t.no,proje:t.musteri,tanim:t.tanim,malzeme:t.malzeme,en:t.en,boy:t.boy,kalinlik:t.kalinlik,renk:t.renk,adet:t.adet}});
}
async function mAutoOpen(x){
 var r=await dlg("Otomatik kayıt",[{msg:"Bu satır, yapılacak iş listesindeki #"+x.tno+" numaralı görevden otomatik oluşturuldu. Değiştirmek için görevi düzenleyin."}],["Görevi Aç","Kapat"]);
 if(r.b!==0)return;
 var t=T.list.filter(function(i){return i.no===x.tno})[0];if(!t)return;
 document.getElementById("ml").classList.add("hide");document.getElementById("isl").classList.remove("hide");renderList();openTk(t);
}
function mOpen(x){mNew=!x;mc=x?JSON.parse(JSON.stringify(x)):{no:M.n};mForm()}
function mForm(){
 var ov=document.getElementById("mfm");ov.innerHTML="";ov.classList.remove("hide");
 var w=mk("div","in fm");w.appendChild(mk("h1","",(mNew?"Yeni kayıt":"Kayıt")+" #"+mc.no)).style.cssText="font-size:20px;margin:0 0 8px";
 MF.forEach(function(F){
  var b=mk("div","fld");b.appendChild(mk("label","",F[1]));
  var i=mk("input");i.type=F[2]==="n"?"number":"text";if(F[2]==="n")i.inputMode="decimal";if(F[3])i.setAttribute("list",F[3]);
  i.value=mc[F[0]]==null?"":mc[F[0]];i.oninput=function(){mc[F[0]]=i.value};
  b.appendChild(i);w.appendChild(b);
 });
 var fb=mk("div","fbar"),br=mk("div","bar2");
 var b1=mk("button","","Kaydet"),b2=mk("button","sec","Kapat");b1.type=b2.type="button";
 b1.onclick=function(){
  var ix=-1;M.list.forEach(function(x,n){if(x.no===mc.no)ix=n});
  if(ix<0){M.list.push(mc);M.n=Math.max(M.n,mc.no+1)}else M.list[ix]=mc;
  saveM();mClose();mlRender();
 };
 b2.onclick=mClose;br.appendChild(b1);br.appendChild(b2);
 if(!mNew){var b3=mk("button","sec","Sil");b3.type="button";
  b3.onclick=async function(){var r=await dlg("Kayıt silinsin mi?",[{msg:"#"+mc.no+" numaralı kayıt silinecek."}],["Sil","Vazgeç"]);
   if(r.b===0){M.list=M.list.filter(function(x){return x.no!==mc.no});saveM();mClose();mlRender()}};
  br.appendChild(b3)}
 fb.appendChild(br);ov.appendChild(w);ov.appendChild(fb);
}
document.getElementById("mbk").onclick=homeBack;
document.getElementById("mnew").onclick=function(){mOpen(null)};
document.getElementById("mam").onclick=function(){mrep=true;mlRender()};



try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
u.value=get();
(function(){var q=getSess();if(q&&q.u){show(q.u);if(q.p)go(q.p)}})();
